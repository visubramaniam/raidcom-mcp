name: Bug report
description: raidcom-mcp builds a wrong or invalid command, or doesn't work as documented.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. **This repository is public.** Before you submit, remove anything that identifies your environment: serial numbers, WWNs, host names, IP addresses and user names. Use placeholders such as `410001` or `esx01`.

        For a **security problem**, don't open an issue: use **Security → Report a vulnerability** instead, as [SECURITY.md](https://github.com/visubramaniam/raidcom-mcp/blob/main/SECURITY.md) describes.

        If the server picked the **wrong command** for a question, use the *Search problem* form. If a command the manual shows is **rejected**, use the *Catalogue problem* form.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: The tool call or question
      description: The question you asked, or the tool and its arguments.
  - type: input
    id: version
    attributes:
      label: raidcom-mcp version
      description: "From the server's `ready:` line or package.json."
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`, or "Docker".
