name: Release

# Builds every package for a v* tag: the npm package, the Claude Desktop extension (.mcpb), standalone packages for
# macOS, Linux and Windows (with Node.js bundled) and the command-builder skill zip. Tests them, attaches them to the
# tag's GitHub release (created from the tag's CHANGELOG.md section), publishes the npm package unless that version is
# already there, lists it in the MCP Registry, pushes the multi-arch Docker image to ghcr.io (and Docker Hub when its
# credentials are set) and tests the Windows packages on Windows x64 and arm64 machines (windows.yml). The Tag release workflow starts it when a merged pull request
# bumps the version; pushing a v* tag by hand or running it for an existing tag also works.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, e.g. v0.1.1
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  IMAGE: docker.io/subramaniamv/raidcom-mcp
  GHCR_IMAGE: ghcr.io/visubramaniam/raidcom-mcp

jobs:
  packages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Check the tag matches package.json
        id: version
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run package
      - name: Smoke-test the npm package as installed
        run: node tests/smoke/package-smoke.mjs "release/raidcom-mcp-${{ steps.version.outputs.version }}.tgz" "${{ steps.version.outputs.version }}"
      - name: Smoke-test the standalone Linux package
        run: |
          version=${{ steps.version.outputs.version }}
          tar -xzf "release/raidcom-mcp-$version-linux-x64.tar.gz" -C release
          node tests/smoke/standalone-smoke.mjs "release/raidcom-mcp-$version-linux-x64" "$version"

      - name: Attach the packages to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # the lines under the heading "## <version>" (exactly that version), up to the next "## " heading
            awk -v v="$VERSION" '/^## / { f = ($2 == v); next } f' CHANGELOG.md > notes.md
            [ -s notes.md ] || echo "Release $VERSION" > notes.md
            gh release create "$TAG" --verify-tag --title "$VERSION" --notes-file notes.md
          fi
          gh release upload "$TAG" release/*.tgz release/*.mcpb release/*.tar.gz release/*.zip release/SHA256SUMS --clobber

  npm:
    # Publishes the exact .tgz attached to the release, using npm trusted publishing: npm checks this workflow's OIDC
    # token, so no npm token is stored, and adds a provenance attestation. Configure the trusted publisher on
    # npmjs.com (package settings → workflow release.yml) before the first release; until then this job fails and the
    # rest of the release is unaffected.
    runs-on: ubuntu-latest
    needs: packages
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish to npm
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.packages.outputs.version }}
        run: |
          if npm view "raidcom-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "raidcom-mcp@$VERSION is already on npm; nothing to publish"
            exit 0
          fi
          gh release download "$TAG" --pattern "raidcom-mcp-$VERSION.tgz" --pattern SHA256SUMS
          grep " raidcom-mcp-$VERSION.tgz$" SHA256SUMS | sha256sum -c -
          npm install -g npm@11.6.2
          npm publish "raidcom-mcp-$VERSION.tgz" --access public

  mcp-registry:
    # Lists the release in the official MCP Registry. GitHub OIDC proves the io.github.visubramaniam/ namespace; the
    # registry checks that the npm package's mcpName matches server.json's name. Skips a version already listed.
    runs-on: ubuntu-latest
    needs: [packages, npm]
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.packages.outputs.version }}
      MCP_PUBLISHER_VERSION: v1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - name: Check whether to publish
        id: check
        run: |
          name=$(jq -r .name server.json)
          sv=$(jq -r .version server.json)
          if [ "$sv" != "$VERSION" ]; then
            echo "::error::server.json version $sv does not match package.json version $VERSION"
            exit 1
          fi
          for i in $(seq 1 20); do
            got=$(npm view "raidcom-mcp@$VERSION" mcpName 2>/dev/null || true)
            [ -n "$got" ] && break
            sleep 15
          done
          if [ "$got" != "$name" ]; then
            echo "::error::raidcom-mcp@$VERSION on npm has mcpName '$got', expected '$name'"
            exit 1
          fi
          url="https://registry.modelcontextprotocol.io/v0.1/servers/$(jq -rn --arg n "$name" '$n|@uri')/versions/$VERSION"
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 --retry 3 --retry-all-errors "$url" || true)
          case "$status" in
            200) echo "::notice::$name $VERSION is already in the MCP Registry"; exit 0 ;;
            404) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Couldn't check the MCP Registry for $name $VERSION (HTTP $status)"; exit 1 ;;
          esac
      - name: Install mcp-publisher
        if: steps.check.outputs.publish
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: Publish to the MCP Registry
        if: steps.check.outputs.publish
        run: |
          ./mcp-publisher validate
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

  windows:
    # Tests the release's Windows packages on Windows x64 and arm64 machines.
    needs: packages
    uses: ./.github/workflows/windows.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}

  docker:
    # Always pushes to GitHub Container Registry with the workflow's own token; also pushes to Docker Hub when the
    # DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets are set.
    runs-on: ubuntu-latest
    needs: packages
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Choose registries
        id: registries
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          VERSION: ${{ needs.packages.outputs.version }}
        run: |
          set -o pipefail
          # "latest" only moves forward: rebuilding an older release doesn't take it back
          newest=$(git ls-remote --tags --refs "https://github.com/$GITHUB_REPOSITORY" 'v*' | sed 's#.*refs/tags/v##' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -z "$newest" ]; then echo "::error::could not list the release tags"; exit 1; fi
          latest=""; [ "$newest" = "$VERSION" ] && latest=true
          tags="$GHCR_IMAGE:$VERSION${latest:+,$GHCR_IMAGE:latest}"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            tags="$tags,$IMAGE:$VERSION${latest:+,$IMAGE:latest}"
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are not set; pushing to ghcr.io only"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: steps.registries.outputs.dockerhub
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.registries.outputs.tags }}

  plugin-bump:
    # Starts the Plugin release workflow, which opens the pull request that moves the plugin to this version. Only
    # after npm has the version, because the plugin installs the server from npm.
    runs-on: ubuntu-latest
    needs: [packages, npm]
    permissions:
      actions: write
    steps:
      - name: Start the plugin bump
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.packages.outputs.version }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -o pipefail
          # only the newest release moves the plugin; rebuilding an older release leaves it alone
          newest=$(git ls-remote --tags --refs "https://github.com/$GH_REPO" 'v*' | sed 's#.*refs/tags/v##' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ "$newest" != "$VERSION" ]; then echo "::notice::$VERSION is not the newest release ($newest); the plugin is not moved"; exit 0; fi
          gh workflow run plugin-release.yml --ref "$BRANCH" -f version="$VERSION"
