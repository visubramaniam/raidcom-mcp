name: Dependency review

# Fails a pull request that adds or upgrades a dependency (npm packages, GitHub Actions) to a version with a known
# vulnerability of moderate severity or higher, and posts a summary on the pull request.
on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
